name: Fetch Image
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL of the image to fetch'
        required: true
        type: string
      filename:
        description: 'Filename to save as (e.g. angle_side.jpg)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download image
        run: curl -L -o "${{ github.event.inputs.filename }}" "${{ github.event.inputs.image_url }}"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.filename }}"
          git commit -m "Fetch image: ${{ github.event.inputs.filename }}" || echo "No changes to commit"
          git pull --rebase origin main
          git push
