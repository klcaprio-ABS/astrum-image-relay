name: Fetch Image
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL of the image to fetch'
        required: true
        type: string
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download image
        run: curl -L -o photo.jpg "${{ github.event.inputs.image_url }}"
      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fetched-photo
          path: photo.jpg
          retention-days: 1
